[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "metrora"
version = "0.2.0"
description = "Metrora: a local-first cloud FinOps analytics platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Metrora Project" },
]
dependencies = [
    "boto3>=1.34,<2",
    "duckdb>=1.0,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "pyarrow>=16,<23",
    "python-dotenv>=1.0,<2",
    "statsmodels>=0.14,<1",
    "streamlit>=1.50,<2",
    "xlrd>=2.0,<3",
]

[project.optional-dependencies]
cloud = [
    "azure-identity>=1.17,<2",
    "azure-storage-blob>=12.22,<13",
    "db-dtypes>=1.3,<2",
    "google-cloud-bigquery>=3.25,<4",
]
desktop = [
    "pyinstaller>=6.11,<7",
    "pywebview>=5.3,<7",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[project.scripts]
metrora-check = "finops_cost_intelligence.cli:main"
metrora-desktop = "finops_cost_intelligence.desktop:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finops_cost_intelligence = ["warehouse/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

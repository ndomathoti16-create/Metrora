name: Windows desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install desktop and cloud dependencies
        run: python -m pip install -e ".[cloud,desktop]"
      - name: Verify release source
        run: |
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check .
          python -m compileall -q app.py src tests data/demo
      - name: Build portable Metrora application
        run: python -m PyInstaller packaging/metrora.spec --noconfirm --clean
      - name: Package Windows download
        shell: powershell
        run: Compress-Archive -Path dist\Metrora\* -DestinationPath dist\Metrora-Windows-x64.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metrora-Windows-x64
          path: dist/Metrora-Windows-x64.zip
          if-no-files-found: error
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag "dist\Metrora-Windows-x64.zip#Metrora-Windows-x64.zip" `
            --title "Metrora $tag" `
            --generate-notes `
            --verify-tag
